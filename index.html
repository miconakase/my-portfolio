<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mico Nakase | Portfolio</title>
    <meta name="description" content="Mico Nakase, a Full Stack & Gen AI developer and music producer from Laguna, PH. Projects, music, journey and contact." />

    <!-- Link previews on Facebook, LinkedIn, Messenger, X, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.miconakase.xyz/" />
    <meta property="og:title" content="Mico Nakase | Portfolio" />
    <meta property="og:description" content="Full Stack & Gen AI developer and music producer from Laguna, PH." />
    <meta property="og:image" content="https://www.miconakase.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mico Nakase portfolio card" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Search engines: one official address, and who this site is about -->
    <link rel="canonical" href="https://www.miconakase.xyz/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mico Nakase",
        "url": "https://www.miconakase.xyz/",
        "image": "https://www.miconakase.xyz/og-image.png",
        "jobTitle": "Full Stack & Gen AI Developer",
        "address": { "@type": "PostalAddress", "addressRegion": "Laguna", "addressCountry": "PH" },
        "sameAs": [
          "https://github.com/miconakase",
          "https://www.linkedin.com/in/mico-nakase-0835b1391/",
          "https://www.facebook.com/mics12345",
          "https://www.instagram.com/itsmicssss_/",
          "https://www.tiktok.com/@micodevph"
        ]
      }
    </script>
    <!-- api/page.js puts a plain copy of the content inside #root for crawlers. It's the same
         content the app renders, kept invisible for the moment before React replaces it. -->
    <style>
      .prerender { opacity: 0; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
